<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BASE — проверка формул</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root { color-scheme: light dark; --bg: #f2f2f4; --card: #fff; --ink: #0b0b0d; --ink-2: #55555c; --good: #128a3c; --bad: #c0392b; --line: rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d0e10; --card: #17181b; --ink: #f4f4f6; --ink-2: #a8a8b0; --good: #3ad06b; --bad: #ff6b5e; --line: rgba(255,255,255,.08); } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px); }
    h1 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 6px; }
    p { color: var(--ink-2); margin: 0 0 16px; }
    .sum { font-size: 20px; font-weight: 700; padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-bottom: 14px; }
    .ok { color: var(--good); } .bad { color: var(--bad); }
    ul { list-style: none; padding: 0; margin: 0; background: var(--card); border-radius: 16px; border: 1px solid var(--line); }
    li { padding: 11px 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
    li:first-child { border-top: 0; }
    li small { display: block; color: var(--bad); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Проверка формул</h1>
    <p>Эти проверки выполняют тот же модуль <code>finance.js</code>, который считает все экраны BASE. <a href="./index.html">← Вернуться в приложение</a></p>
    <div id="sum" class="sum">Выполняю…</div>
    <ul id="list"></ul>
  </main>
  <script src="./finance.js"></script>
  <script src="./finance.test.js"></script>
  <script>
    (function () {
      var res = window.runBaseTests(window.BaseFinance);
      var failed = res.filter(function (r) { return !r.ok; }).length;
      var sum = document.getElementById('sum');
      sum.textContent = (res.length - failed) + ' из ' + res.length + ' проверок пройдено';
      sum.className = 'sum ' + (failed ? 'bad' : 'ok');
      var list = document.getElementById('list');
      res.forEach(function (r) {
        var li = document.createElement('li');
        var mark = document.createElement('span');
        mark.textContent = r.ok ? '✓' : '✗';
        mark.className = r.ok ? 'ok' : 'bad';
        var text = document.createElement('span');
        text.textContent = r.name;
        if (!r.ok) { var s = document.createElement('small'); s.textContent = r.error; text.appendChild(s); }
        li.appendChild(mark); li.appendChild(text);
        list.appendChild(li);
      });
    })();
  </script>
</body>
</html>
